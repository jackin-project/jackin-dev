name: reuse-compliance
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]
permissions:
  contents: read
concurrency:
  group: reuse-compliance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reuse:
    name: REUSE compliance (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        # Post-merge push is rejected by fleet admission (merged_push_occupancy),
        # so push runs the GitHub lane; dispatch defaults to the Velnor lane.
        config: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.lanes == 'both') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"]},{"lane":"GitHub","runner":"ubuntu-26.04"}]' || (github.event_name == 'workflow_dispatch' && inputs.lanes == 'velnor') && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"]}]' || '[{"lane":"GitHub","runner":"ubuntu-26.04"}]') }}
    # dispatch default lane resolves to [self-hosted, velnor-target-mvp]
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
