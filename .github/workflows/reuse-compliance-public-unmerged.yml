name: reuse-compliance (public unmerged)
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: reuse-compliance-public-unmerged-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reuse:
    name: REUSE compliance (${{ matrix.config.lane }})
    strategy:
      fail-fast: false
      matrix:
        config: [{"lane":"GitHub","runner":"ubuntu-26.04"}]
    runs-on: ${{ matrix.config.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
